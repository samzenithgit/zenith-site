name: Notify search engines (IndexNow)

# After each push to main, wait for Netlify to publish, then submit every
# sitemap URL to IndexNow (Bing, Yandex, Seznam, Naver and others share it).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Netlify deploy
        run: sleep 180
      - name: Submit sitemap URLs
        env:
          INDEXNOW_KEY: cf4ac92438c349968087ea0308752bf6
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's/<loc>//' -e 's#</loc>##' | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          body=$(printf '{"host":"www.zenithecon.com","key":"%s","keyLocation":"https://www.zenithecon.com/%s.txt","urlList":%s}' "$INDEXNOW_KEY" "$INDEXNOW_KEY" "$urls")
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow response: $status"
          case "$status" in 200|202) ;; *) exit 1 ;; esac
